
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">
  <title>استمارة تسجيل البيانات</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px;
      font-family: Arial, sans-serif;
      background: #f3f6f5;
      color: #22302b;
    }

    main {
      max-width: 530px;
      margin: 24px auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 7px 28px #0000000c;
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin: 0 0 24px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 17px 0 8px;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 13px;
      border: 1px solid #c5d2cb;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      font: inherit;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      background: #176747;
      color: white;
      cursor: pointer;
    }

    button.secondary {
      background: #e7f1eb;
      color: #176747;
      border: 1px solid #b1d7c2;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .choices, .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    #cameraArea {
      display: none;
      margin-top: 17px;
    }

    video, #preview {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 11px;
      background: #edf0ee;
    }

    #preview {
      display: none;
      margin-top: 18px;
    }

    .hint {
      font-size: 13px;
      color: #68786e;
      line-height: 1.8;
    }

    #message {
      min-height: 24px;
      text-align: center;
      margin-top: 15px;
      line-height: 1.7;
    }

    #send {
      display: block;
      width: 100%;
      margin-top: 20px;
    }

    .trap {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      left: -9999px;
    }

    @media (max-width: 370px) {
      main { padding: 18px; }
      .choices { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
<main>
  <h1>استمارة تسجيل البيانات</h1>

  <form
    id="registrationForm"
    method="POST"
    target="_blank"
  >
    <label for="fullName">الاسم الكامل</label>
    <input
      id="fullName"
      name="fullName"
      type="text"
      maxlength="150"
      autocomplete="name"
      required
    >

    <label for="phone">رقم الهاتف</label>
    <input
      id="phone"
      name="phone"
      type="tel"
      maxlength="25"
      autocomplete="tel"
      required
    >

    <label>الصورة الشخصية</label>

    <div class="choices">
      <button
        type="button"
        id="startCamera"
      >📷 التقاط صورة</button>

      <button
        type="button"
        id="chooseFile"
        class="secondary"
      >📁 تحميل صورة</button>
    </div>

    <input
      id="filePicker"
      type="file"
      accept="image/*"
      hidden
    >

    <section id="cameraArea">
      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div class="controls">
        <button
          type="button"
          id="capture"
        >التقاط الآن</button>

        <button
          type="button"
          id="stopCamera"
          class="secondary"
        >إغلاق الكاميرا</button>
      </div>
    </section>

    <img id="preview" alt="معاينة الصورة">

    <input
      type="hidden"
      id="imageData"
      name="imageData"
    >

    <input
      type="hidden"
      id="photoSource"
      name="photoSource"
    >

    <input
      type="hidden"
      id="requestId"
      name="requestId"
    >

    <div class="trap" aria-hidden="true">
      <label for="website">اترك هذا الحقل فارغاً</label>
      <input
        id="website"
        name="website"
        type="text"
        tabindex="-1"
        autocomplete="off"
      >
    </div>

    <p class="hint">
      يمكنك التقاط صورة مباشرة باستخدام الكاميرا،
      أو تحميل صورة محفوظة من جهازك.
      ستظهر معاينة قبل إرسال الاستمارة.
    </p>

    <button id="send" type="submit">
      إرسال الاستمارة
    </button>

    <p id="message" role="status"
       aria-live="polite"></p>
  </form>
</main>

<script>
'use strict';

/**
 * IMPORTANT:
 * Replace the URL below with your own
 * deployed Apps Script Web App URL ending /exec.
 */
const SCRIPT_URL =
  'PASTE_YOUR_GOOGLE_APPS_SCRIPT_EXEC_URL_HERE';

const MAX_IMAGE_BYTES = 2 * 1024 * 1024;

const $ = id => document.getElementById(id);

const form = $('registrationForm');
const video = $('video');
const preview = $('preview');
const message = $('message');

let stream = null;
let imageReady = false;
let busy = false;


/**
 * Stop the camera and release its tracks.
 */
function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
  }

  stream = null;
  video.srcObject = null;
  $('cameraArea').style.display = 'none';
}


/**
 * Scale photo and encode as JPEG.
 *
 * Smaller output is safer for Apps Script POST.
 */
async function encodeJPEG(source, width, height) {
  if (!width || !height) {
    throw new Error('أبعاد الصورة غير صالحة.');
  }

  const scale = Math.min(
    1,
    1400 / Math.max(width, height)
  );

  const canvas = document.createElement('canvas');

  canvas.width = Math.max(1, Math.round(width * scale));
  canvas.height = Math.max(1, Math.round(height * scale));

  const context = canvas.getContext('2d');

  if (!context) {
    throw new Error('تعذرت معالجة الصورة.');
  }

  context.drawImage(
    source,
    0,
    0,
    canvas.width,
    canvas.height
  );

  let quality = 0.82;

  for (let attempt = 0; attempt < 5; attempt++) {
    const dataURL = canvas.toDataURL(
      'image/jpeg',
      quality
    );

    if (!dataURL.startsWith('data:image/jpeg;base64,')) {
      throw new Error('تعذر تحويل الصورة إلى JPEG.');
    }

    const base64 = dataURL.split(',')[1];

    const size = Math.floor(
      base64.length * 3 / 4
    );

    if (size <= MAX_IMAGE_BYTES) {
      return dataURL;
    }

    quality -= 0.13;
  }

  throw new Error(
    'الصورة كبيرة جداً حتى بعد الضغط.'
  );
}


/**
 * Set photo preview and form values.
 */
function setPhoto(dataURL, source) {
  $('imageData').value = dataURL;
  $('photoSource').value = source;

  preview.src = dataURL;
  preview.style.display = 'block';

  $('requestId').value = crypto.randomUUID();

  imageReady = true;

  message.textContent =
    'تم تجهيز الصورة بنجاح. يمكنك إرسال الاستمارة.';
}


/**
 * Open camera using browser media API.
 */
$('startCamera').addEventListener(
  'click',
  async () => {
    if (busy) return;

    stopCamera();

    try {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error(
          'المتصفح لا يدعم تشغيل الكاميرا.'
        );
      }

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' }
        },
        audio: false
      });

      video.srcObject = stream;
      $('cameraArea').style.display = 'block';

      await video.play();

      message.textContent =
        'الكاميرا تعمل. اضغط التقاط الآن.';

    } catch (error) {
      stopCamera();

      message.textContent =
        'تعذر تشغيل الكاميرا: ' + error.message;
    }
  }
);


/**
 * Capture current camera frame.
 */
$('capture').addEventListener(
  'click',
  async () => {
    if (!stream || !video.videoWidth || busy) {
      return;
    }

    busy = true;

    try {
      const dataURL = await encodeJPEG(
        video,
        video.videoWidth,
        video.videoHeight
      );

      setPhoto(dataURL, 'camera');
      stopCamera();

    } catch (error) {
      message.textContent = error.message;

    } finally {
      busy = false;
    }
  }
);


/**
 * Close camera manually.
 */
$('stopCamera').addEventListener(
  'click',
  stopCamera
);


/**
 * Open file chooser.
 */
$('chooseFile').addEventListener(
  'click',
  () => {
    if (!busy) $('filePicker').click();
  }
);


/**
 * Handle device photo upload.
 *
 * Uses Image element instead of createImageBitmap
 * for broader Safari compatibility.
 */
$('filePicker').addEventListener(
  'change',
  async event => {
    const file = event.target.files?.[0];

    if (!file || busy) return;

    busy = true;
    stopCamera();

    const url = URL.createObjectURL(file);

    try {
      if (!file.type.startsWith('image/')) {
        throw new Error('اختر صورة فقط.');
      }

      const img = new Image();

      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = () => reject(
          new Error('تعذر فتح الصورة.')
        );

        img.src = url;
      });

      const dataURL = await encodeJPEG(
        img,
        img.naturalWidth,
        img.naturalHeight
      );

      setPhoto(dataURL, 'upload');

    } catch (error) {
      message.textContent =
        'تعذرت معالجة الصورة: ' + error.message;

    } finally {
      URL.revokeObjectURL(url);
      event.target.value = '';
      busy = false;
    }
  }
);


/**
 * Validate before native POST.
 *
 * Browser opens the server result in a new tab.
 * Do not show a false "saved" message locally.
 */
form.addEventListener('submit', event => {
  const validURL =
    /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/
      .test(SCRIPT_URL);

  if (!validURL) {
    event.preventDefault();

    message.textContent =
      'يجب ضبط رابط Google Apps Script أولاً.';
    return;
  }

  if (busy || !imageReady || !$('imageData').value) {
    event.preventDefault();

    message.textContent =
      'يرجى تجهيز الصورة قبل الإرسال.';
    return;
  }

  if (!form.checkValidity()) {
    event.preventDefault();
    form.reportValidity();
    return;
  }

  // Native cross-origin HTML form submission.
  form.action = SCRIPT_URL;

  message.textContent =
    'يجري فتح نتيجة الإرسال في تبويب جديد. ' +
    'تأكد من ظهور رسالة الحفظ قبل إعادة الإرسال.';
});


window.addEventListener('pagehide', stopCamera);
</script>
</body>
</html>
